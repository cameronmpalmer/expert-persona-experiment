[project]
name = "persona-experiment"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "palmtrey", email = "cameron@cameronmpalmer.com" }
]
requires-python = ">=3.14"
dependencies = [
    "matplotlib>=3.11.2",
    "pyarrow>=26.0.0",
    "pytest-cov>=7.1.0",
    "tqdm>=4.70.1",
]

[dependency-groups]
dev = [
    "coverage>=7.16.2",
    "ruff>=0.17.0",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
# Long verbatim study prompts and fixed-width table headers exceed the limit;
# ruff format keeps code within line-length, E501 would only flag strings.
ignore = ["E501"]

[tool.coverage.run]
source = ["scripts"]

[tool.coverage.report]
# Report only on modules the suite tests; measure all of scripts/. Add modules
# here as they gain tests.
include = ["scripts/run_experiment.py", "scripts/sample_mmlu.py", "scripts/analyze_results.py"]
show_missing = true
